<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
   <h1>HTML Forms</h1>
   <hr>
   <br>
   <div>
       <p>  
          Levi Ackerman: "Give up on your dream and die. Lead the new recruits into hell.
       </p>
   </div>
    <form action="#" method="POST">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password">
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required placeholder="Enter your age">
        <br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="" disabled selected>Select your gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>

        <label for="coding">Coding Languages:</label>
        <br>
        <input type="checkbox" id="coding" name="coding" value="python">Python
        <input type="checkbox" id="coding" name="coding" value="javascript">JavaScript
        <input type="checkbox" id="coding" name="coding" value="HTML">HTML
        <input type="checkbox" id="coding" name="coding" value="CSS">CSS
        <input type="checkbox" id="coding" name="coding" value="java">Java
        <input type="checkbox" id="coding" name="coding" value="C++">C++
        <input type="checkbox" id="coding" name="coding" value="other">Other
        <br><br>

        <label for="Dateofbirth">Date of Birth:</label>
        <input type="date" id="Dateofbirth" name="Dateofbirth" required>
        <br><br>

        <label for="subscription">Subscribe to my premium side plan:</label>
        <input type="radio" id="subscription" name="subscription" value="yes">Yes
        <input type="radio" id="subscription" name="subscription" value="no">No
        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required placeholder="Enter your message"></textarea>
        <br><br>

        <button type="submit" value="Submit">Submit</button>
        <br><br>
        <button type="reset" value="Reset">Reset</button>

    </form>
</body>
</html>
