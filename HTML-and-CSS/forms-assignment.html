<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms-Assisnment</title>
</head>
<body>
    <h1 style="text-align: center;">Forms Assignment</h1>
    <br>
    <hr>
    <br>
    <forms>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email address">
        <br><br>

        <label for="file">File:</label>
        <input type="file" id="file" name="file" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="skills">Skills:</label>
        <input type="checkbox" id="skills" name="skills" value="HTML">HTML
        <input type="checkbox" id="skills" name="skills" value="CSS">CSS
        <input type="checkbox" id="skills" name="skills" value="JavaScript">JavaScript
        <input type="checkbox" id="skills" name="skills" value="Python">Python
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city" required>
            <option value="" disabled selected>Select your city</option>
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="patna">Patna</option>
        </select>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male"    required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>  
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label>
        <br><br>

        <input type="submit" value="Submit">
        <br><br>
        <input type="reset" value="Reset">
    </forms>
</body>
</html>
