<!DOCTYPE html>
<html>
<head>
    <title>Happy Coding</title>

    <style>
        body {
            margin: 0;
            background-color: red;
        }

        .box1 {
            width: 90%;
            height: 850px;
            margin: 40px auto;
            background-color: orange;
            border: 2px solid black;
        }

        .box2 {
            width: 85%;
            height: 760px;
            margin: 55px auto;
            background-color: yellow;
            border: 2px solid black;
        }

        .box3 {
            width: 80%;
            height: 645px;
            margin: 55px auto;
            background-color: lime;
            border: 2px solid black;
        }

        .box4 {
            width: 75%;
            height: 530px;
            margin: 55px auto;
            background-color: blue;
            border: 2px solid black;
        }

        .box5 {
            width: 65%;
            height: 415px;
            margin: 55px auto;
            background-color: purple;
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box5 h1 {
            color: white;
            font-size: 70px;
            font-family: "Times New Roman", serif;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box1">

        <div class="box2">

            <div class="box3">

                <div class="box4">

                    <div class="box5">
                        <h1>Happy<br>Coding!</h1>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
